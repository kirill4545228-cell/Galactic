name: Build plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack zip
        run: |
          zipfile=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$zipfile" ]; then echo "В корне репозитория нет .zip файла"; exit 1; fi
          echo "Распаковываю: $zipfile"
          mkdir -p project
          unzip -o "$zipfile" -d project
          pom=$(find project -name pom.xml -not -path '*/target/*' | head -n 1)
          if [ -z "$pom" ]; then echo "В архиве нет pom.xml"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$pom")" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          mvn -B package

      - name: Collect jar
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/target/CosmosShow.jar out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmosShow
          path: out/CosmosShow.jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/CosmosShow.jar \
            --title "CosmosShow build ${{ github.run_number }}" \
            --notes "Готовый плагин для Paper 1.21.11"
